project_id = "southern-revelry-command-center"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = false

[auth.email]
# Local browser QA needs password login for the fixture account. This setting is
# consumed by `supabase start`; it does not change the hosted project's auth policy.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[realtime]
enabled = true

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[analytics]
enabled = true
port = 55327
